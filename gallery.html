<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>고려·조선 문화유산 특별전 실시간 갤러리</title>
  <style>
    :root {
      --header-bg: #1C2830;
      --accent: #A07828;
      --accent-light: #C89A40;
      --bg: #EAE3D2;
      --card-bg: #F6F1E7;
      --timer-bg: #141D23;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Malgun Gothic', sans-serif; color: #1C2830; padding: 1.5rem; }

    .timer-banner {
      background: var(--timer-bg);
      color: #fff;
      padding: 1rem 1.8rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      border-left: 6px solid var(--accent-light);
    }
    .timer-info h1 { font-size: 1.4rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .timer-info p { font-size: 0.85rem; color: var(--accent-light); margin-top: 0.2rem; }
    .timer-box { display: flex; align-items: center; gap: 1.2rem; }
    .countdown-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.2rem;
      font-weight: bold;
      color: #F8D675;
      letter-spacing: 2px;
      background: #0B1013;
      padding: 0.2rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }
    .timer-controls button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .timer-controls button:hover { background: var(--accent-light); }

    .admin-bar {
      display: none;
      background: #8B0000;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.88rem;
      font-weight: bold;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .admin-bar.active { display: flex; }
    .btn-admin-exit {
      background: #fff; color: #8B0000; border: none;
      padding: 0.35rem 0.8rem; border-radius: 4px;
      font-weight: bold; font-size: 0.8rem; cursor: pointer;
    }
    .card-del-btn {
      display: none;
      position: absolute; bottom: 8px; right: 8px;
      background: #8B0000; color: #fff; border: none;
      padding: 0.25rem 0.5rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: bold; cursor: pointer;
      z-index: 10;
    }
    .admin-mode-on .card-del-btn { display: block; }
    .btn-admin-login {
      background: #4a2020; color: #ffcccc; border: 1px solid #8B0000;
      padding: 0.45rem 0.7rem; border-radius: 4px;
      font-size: 0.78rem; font-weight: bold; cursor: pointer;
    }
    .btn-admin-login:hover { background: #8B0000; color: #fff; }

    .expo-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .expo-hall { background: rgba(255,255,255,0.65); padding: 1.2rem; border-radius: 8px; border: 1px solid #D8CABA; }
    .hall-title { font-size: 1.25rem; font-weight: bold; padding-bottom: 0.6rem; border-bottom: 2px solid var(--header-bg); margin-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
    .hall-badge { font-size: 0.8rem; background: var(--header-bg); color: var(--accent-light); padding: 0.2rem 0.6rem; border-radius: 12px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; position: relative; border: 1px solid #D8CABA; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 135px; object-fit: cover; background: #eee; display: block; }
    .card-thumb { width: 100%; height: 135px; overflow: hidden; background: #D8CABA; display: flex; align-items: center; justify-content: center; }
    .card-thumb-ph { font-size: 2.8rem; line-height: 1; }
    .card-body { padding: 0.75rem; }
    .card-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-curator { font-size: 0.75rem; color: #555; }
    .vote-tag { position: absolute; top: 8px; right: 8px; background: rgba(28,40,48,0.88); color: var(--accent-light); padding: 0.2rem 0.55rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--accent); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 1rem; z-index: 1000; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 720px; max-height: 90vh; border-radius: 6px; overflow-y: auto; padding: 1.8rem; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1.2rem; font-size: 1.5rem; font-weight: bold; cursor: pointer; border: none; background: none; }
    .modal-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1rem; }
    .modal-gallery img { width: 100%; height: 200px; object-fit: contain; background: #faf8f5; border-radius: 4px; border: 1px solid #ddd; }
  .score-section { margin-top:1.2rem; border-top:2px solid #A07828; padding-top:1rem; }
  .score-section label { display:block; font-size:0.8rem; font-weight:bold; color:#1C2830; margin:0.55rem 0 0.2rem; }
  .score-section select { width:100%; padding:0.4rem; border:1px solid #ccc; border-radius:4px; font-size:0.78rem; color:#1C2830; background:#fff; }
  .score-tag { position:absolute; bottom:8px; left:8px; background:#1C2830; color:#C89A40; padding:0.15rem 0.45rem; border-radius:10px; font-size:0.7rem; font-weight:bold; border:1px solid #A07828; display:none; }
  .admin-mode-on .score-tag { display:block; }
  .feedback-indicator { position:absolute; top:8px; left:8px; padding:0.15rem 0.45rem; border-radius:10px; font-size:0.7rem; font-weight:bold; display:none; }
  .feedback-indicator.ai { background:#7B2D8B; color:#f0e6f6; border:1px solid #a855f7; }
  .feedback-indicator.error { background:#8B0000; color:#ffe6e6; border:1px solid #dc2626; }
  .feedback-indicator.general { background:#555; color:#eee; border:1px solid #888; }
  .admin-mode-on .feedback-indicator { display:block; }
  .feedback-section { margin-top:1rem; border-top:2px solid #1C2830; padding-top:0.8rem; }
  .fb-tag-btn { background:#f0f0f0; color:#333; border:1px solid #ccc; padding:0.3rem 0.6rem; border-radius:14px; font-size:0.78rem; cursor:pointer; transition:background 0.15s; }
  .fb-tag-btn:hover { background:#e0e0e0; }

  #print-area { display: none; }
  @media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; }
    .print-panel { page-break-after: always; padding: 1.5cm; font-family: 'Malgun Gothic', sans-serif; color: #000; }
    .print-panel:last-child { page-break-after: auto; }
    .print-hall { font-size: 10pt; color: #A07828; font-weight: bold; margin-bottom: 4pt; }
    .print-title { font-size: 20pt; font-weight: bold; margin-bottom: 4pt; }
    .print-curator { font-size: 10pt; color: #555; margin-bottom: 10pt; border-bottom: 1pt solid #ccc; padding-bottom: 8pt; }
    .print-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 12pt; margin-bottom: 10pt; }
    .print-imgs img { width: 100%; max-height: 160pt; object-fit: contain; border: 1pt solid #ddd; }
    .print-img-cap { font-size: 8pt; color: #666; text-align: center; margin-top: 2pt; }
    .print-spec { background: #F0E4C0; padding: 6pt 8pt; font-size: 9pt; margin-bottom: 10pt; border-left: 3pt solid #A07828; }
    .print-section-title { font-size: 11pt; font-weight: bold; color: #A07828; border-bottom: 1pt solid #A07828; padding-bottom: 2pt; margin-bottom: 4pt; }
    .print-text { font-size: 10pt; line-height: 1.7; margin-bottom: 10pt; white-space: pre-wrap; }
    .print-source { font-size: 8pt; color: #888; border-top: 1pt solid #ddd; padding-top: 6pt; }
    .print-class-title { font-size: 16pt; font-weight: bold; text-align: center; padding: 20pt 0 10pt; border-bottom: 2pt solid #1C2830; margin-bottom: 20pt; page-break-after: avoid; }
    .print-score { background: #e8f4fd; padding: 4pt 8pt; font-size: 9pt; margin-bottom: 8pt; border-left: 3pt solid #1B6CA8; font-weight: bold; color: #0f4c75; }
  }
  .pw-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(28,40,48,0.97);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .pw-card {
    background: #F6F1E7; border-radius: 14px;
    padding: 36px 30px; text-align: center;
    max-width: 340px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 2px solid #A07828;
  }
  .pw-icon { font-size: 2.6rem; margin-bottom: 10px; }
  .pw-title { font-size: 1.1rem; font-weight: 900; color: #1C2830; margin-bottom: 6px; }
  .pw-sub { font-size: 0.82rem; color: #6B7280; margin-bottom: 18px; }
  .pw-input {
    width: 100%; border: 2px solid #A07828; border-radius: 8px;
    padding: 10px 14px; font-size: 1.1rem; text-align: center;
    letter-spacing: 0.2em; outline: none; background: #fff; color: #1C2830;
    margin-bottom: 12px; font-family: 'Courier New', monospace;
  }
  .pw-input:focus { border-color: #1C2830; }
  .pw-btn {
    width: 100%; background: #1C2830; color: #C89A40;
    border: none; border-radius: 8px; padding: 11px;
    font-size: 0.92rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .pw-btn:hover { background: #2d4050; }
  .pw-err { color: #dc2626; font-size: 0.8rem; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <div class="pw-overlay" id="pwOverlay">
    <div class="pw-card">
      <div class="pw-icon">🏛️</div>
      <div class="pw-title">전시 갤러리 입장</div>
      <div class="pw-sub">선생님께 받은 비밀번호를 입력하세요</div>
      <input class="pw-input" id="pwInput" type="password" placeholder="••••" maxlength="10"
             autocomplete="off" onkeydown="if(event.key==='Enter')checkPw()">
      <button class="pw-btn" onclick="checkPw()">🔓 입장하기</button>
      <div class="pw-err" id="pwErr">비밀번호가 틀렸습니다.</div>
    </div>
  </div>

  <div class="timer-banner">
    <div class="timer-info">
      <h1>🏛️ 고려·조선 특별 기획전</h1>
      <p id="timer-status">1일 학예연구사 패널 기획 마감까지 남은 시간</p>
    </div>
    <div class="timer-box">
      <div class="countdown-display" id="clock">24:00</div>
      <div class="timer-controls">
        <button id="btn-timer" onclick="toggleTimer()">▶ 시작</button>
        <button onclick="resetTimer()">↺ 초기화</button>
        <button onclick="loadGallery()">🔄 갱신</button>
        <button class="btn-admin-login" onclick="enterAdminMode()">🔐 관리</button>
      </div>
    </div>
  </div>

  <div class="admin-bar" id="admin-bar">
    <span>🔐 교사 관리자 모드 — 카드 우하단 [삭제] 버튼으로 패널을 삭제할 수 있습니다</span>
    <div style="display:flex;gap:0.5rem;align-items:center;flex-shrink:0;flex-wrap:wrap;">
      <input type="text" id="anthropic-api-key" placeholder="🔑 Anthropic API 키 (sk-ant-api03-)" autocomplete="off"
        oninput="saveApiKey()"
        style="padding:0.3rem 0.6rem;border:1px solid #1B6CA8;border-radius:4px;font-size:0.78rem;
               background:#f0f8ff;color:#0f4c75;width:280px;" />
      <button id="btn-test-key" onclick="testApiKey()"
        style="background:#1B6CA8;color:#e8f4fd;border:1px solid #1B6CA8;padding:0.35rem 0.8rem;
               border-radius:4px;font-weight:bold;font-size:0.8rem;cursor:pointer;">
        🔑 키 테스트
      </button>
      <button onclick="bulkAutoScore()"
        style="background:#0f4c75;color:#e8f4fd;border:1px solid #1B6CA8;padding:0.35rem 0.8rem;
               border-radius:4px;font-weight:bold;font-size:0.8rem;cursor:pointer;">
        🤖 AI 일괄채점
      </button>
      <button onclick="bulkReScore()"
        style="background:#5a3e8a;color:#f0eaff;border:1px solid #7c5cbf;padding:0.35rem 0.8rem;
               border-radius:4px;font-weight:bold;font-size:0.8rem;cursor:pointer;">
        🔄 재채점
      </button>
      <button onclick="openCriteriaEditor()"
        style="background:#2d6a4f;color:#d8f3dc;border:1px solid #52b788;padding:0.35rem 0.8rem;
               border-radius:4px;font-weight:bold;font-size:0.8rem;cursor:pointer;">
        📋 채점 기준
      </button>
      <button class="btn-admin-exit" onclick="exitAdminMode()">✕ 모드 종료</button>
    </div>
  </div>

  <div id="criteria-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#fff;padding:1.6rem;border-radius:10px;max-width:560px;width:92%;box-shadow:0 10px 40px rgba(0,0,0,0.4);">
      <div style="font-size:1rem;font-weight:bold;color:#2d6a4f;margin-bottom:0.8rem;">📋 채점 기준 편집</div>
      <div style="font-size:0.78rem;color:#666;margin-bottom:0.6rem;">여기서 수정한 기준이 AI 채점에 바로 적용됩니다. (GAS 재배포 불필요)</div>
      <textarea id="criteria-text"
        style="width:100%;height:220px;font-size:0.78rem;font-family:monospace;padding:0.7rem;border:1px solid #ccc;border-radius:6px;resize:vertical;box-sizing:border-box;line-height:1.6;"></textarea>
      <div style="display:flex;gap:0.5rem;margin-top:0.8rem;justify-content:flex-end;">
        <button onclick="resetCriteria()" style="padding:0.4rem 0.9rem;background:#eee;border:1px solid #ccc;border-radius:4px;font-size:0.8rem;cursor:pointer;">↩ 기본값으로</button>
        <button onclick="saveCriteria()" style="padding:0.4rem 0.9rem;background:#2d6a4f;color:#fff;border:none;border-radius:4px;font-size:0.8rem;font-weight:bold;cursor:pointer;">💾 저장</button>
        <button onclick="closeCriteriaEditor()" style="padding:0.4rem 0.9rem;background:#888;color:#fff;border:none;border-radius:4px;font-size:0.8rem;cursor:pointer;">✕ 닫기</button>
      </div>
    </div>
  </div>

  <div style="margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;">
    <label for="class-filter" style="font-weight: bold; font-size: 0.88rem; color: #1C2830;">🏫 전시 반 선택 :</label>
    <select id="class-filter" onchange="applyClassFilter()"
      style="padding: 0.45rem 0.8rem; border-radius: 4px; border: 2px solid #A07828; font-size: 0.88rem; font-weight: bold; color: #1C2830; background: #F6F1E7; cursor: pointer;">
      <option value="">📋 전체 보기</option>
    </select>
    <span id="filter-label" style="font-size: 0.82rem; color: #666;"></span>
    <button id="btn-print-class" onclick="printClass()" style="display:none; background:#1C2830; color:#C89A40; border:1px solid #A07828; border-radius:4px; padding:0.4rem 0.9rem; font-size:0.83rem; font-weight:bold; cursor:pointer;">🖨️ 이 반 전체 출력</button>
    <span style="color:#bbb;font-size:1rem;">│</span>
    <span style="font-weight:bold;font-size:0.88rem;color:#1C2830;">📊 정렬 :</span>
    <button id="sort-btn-votes" onclick="setSortMode('votes')"
      style="background:#1C2830;color:#C89A40;border:1px solid #A07828;border-radius:4px;padding:0.35rem 0.75rem;font-size:0.83rem;font-weight:bold;cursor:pointer;">⭐ 추천순</button>
    <button id="sort-btn-number" onclick="setSortMode('number')"
      style="background:#F6F1E7;color:#1C2830;border:2px solid #ccc;border-radius:4px;padding:0.35rem 0.75rem;font-size:0.83rem;font-weight:bold;cursor:pointer;">🔢 번호순</button>
  </div>
  <div id="print-area"></div>

  <!-- 추천순: 전시관별 2열 -->
  <div class="expo-container" id="view-votes">
    <div class="expo-hall">
      <div class="hall-title">
        <span>고려 특별전시관</span>
        <span class="hall-badge" id="goryeo-count">0점 전시 준비 중</span>
      </div>
      <div class="grid" id="goryeo-grid"></div>
    </div>
    <div class="expo-hall">
      <div class="hall-title">
        <span>조선 특별전시관</span>
        <span class="hall-badge" id="joseon-count">0점 전시 준비 중</span>
      </div>
      <div class="grid" id="joseon-grid"></div>
    </div>
  </div>

  <!-- 번호순: 학급별 섹션 -->
  <div id="view-number" style="display:none;">
    <div id="number-container"></div>
  </div>

  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" id="modal-body">
      <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">&times;</button>
      <div id="modal-inner"></div>
    </div>
  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbweLp9sgFPlQ5rbDBMmKHvuJxp8LjIFOwsKhDySYDZRvBcEEeZtx-LUVStO_WBaVBmOHA/exec";

  const DEFAULT_SECONDS = 24 * 60;
  let remainingSeconds = DEFAULT_SECONDS;
  let timerInterval = null;
  let isRunning = false;

  function updateClockDisplay() {
    const min = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
    const sec = String(remainingSeconds % 60).padStart(2, '0');
    document.getElementById('clock').innerText = `${min}:${sec}`;
  }

  function toggleTimer() {
    const btn = document.getElementById('btn-timer');
    if (isRunning) {
      clearInterval(timerInterval);
      isRunning = false;
      btn.innerText = '▶ 재개';
    } else {
      isRunning = true;
      btn.innerText = '⏸ 일시정지';
      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateClockDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          btn.innerText = '종료됨';
          document.getElementById('timer-status').innerText = '🎉 특별전 정식 개막! 관람객 추천 투표를 시작하세요.';
          document.getElementById('clock').style.color = '#FF6B6B';
          alert('⏰ 전시 준비 시간(24분)이 종료되었습니다!\n모든 패널을 발행하고 갤러리 투어 및 투표를 시작하세요.');
        }
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    remainingSeconds = DEFAULT_SECONDS;
    updateClockDisplay();
    document.getElementById('btn-timer').innerText = '▶ 시작';
    document.getElementById('clock').style.color = '#F8D675';
    document.getElementById('timer-status').innerText = '1일 학예연구사 패널 기획 마감까지 남은 시간';
  }

  const urlParams = new URLSearchParams(window.location.search);
  const urlClass = urlParams.get('class') || '';

  let items = [];
  let currentFilter = urlClass;
  let currentSort = 'votes';

  function loadGallery() {
    if (!GAS_URL || GAS_URL === "GAS_URL_PLACEHOLDER") return;
    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => { items = data; buildClassDropdown(); renderGallery(); })
      .catch(err => console.error(err));
  }

  function buildClassDropdown() {
    const sel = document.getElementById('class-filter');
    const classes = [...new Set(items.map(i => String(i.gradeClass).trim()))].sort();
    sel.innerHTML = '<option value="">📋 전체 보기</option>';
    classes.forEach(cls => {
      const opt = document.createElement('option');
      opt.value = cls;
      opt.textContent = `${cls}반`;
      if (cls === currentFilter) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function applyClassFilter() {
    currentFilter = document.getElementById('class-filter').value;
    document.getElementById('btn-print-class').style.display = 'inline-block';
    document.getElementById('btn-print-class').textContent =
      currentFilter ? `🖨️ ${currentFilter}반 전체 출력` : '🖨️ 전체 출력';
    renderGallery();
  }

  function setSortMode(mode) {
    currentSort = mode;
    const vBtn = document.getElementById('sort-btn-votes');
    const nBtn = document.getElementById('sort-btn-number');
    if (mode === 'number') {
      vBtn.style.background = '#F6F1E7'; vBtn.style.color = '#1C2830'; vBtn.style.border = '2px solid #ccc';
      nBtn.style.background = '#1C2830'; nBtn.style.color = '#C89A40'; nBtn.style.border = '1px solid #A07828';
    } else {
      vBtn.style.background = '#1C2830'; vBtn.style.color = '#C89A40'; vBtn.style.border = '1px solid #A07828';
      nBtn.style.background = '#F6F1E7'; nBtn.style.color = '#1C2830'; nBtn.style.border = '2px solid #ccc';
    }
    renderGallery();
  }

  function makeCard(item) {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openModal(item);
    const itemId = item.id;
    card.innerHTML = `
      <span class="vote-tag">🏷️ ${item.votes}표</span>
      <div class="card-thumb">
        ${item.imageUrl1
          ? `<img src="${item.imageUrl1}" alt="대표 사료" style="width:100%;height:135px;object-fit:cover;" onerror="this.parentElement.innerHTML='<span class=card-thumb-ph>📜</span>'">`
          : `<span class="card-thumb-ph">📜</span>`}
      </div>
      <div class="card-body">
        <div class="card-title">${item.relicName}</div>
        <div class="card-curator">${item.gradeClass} ${item.stdNum}번 ${item.stdName} 큐레이터</div>
      </div>
      <span class="score-tag">${item.totalScore ? `✏️ ${item.totalScore}점` : '미채점'}</span>
      ${item.feedback ? (() => {
        const fb = item.feedback;
        const isAI = fb.includes('AI 생성') || fb.includes('AI생성') || fb.includes('AI 의심');
        const isErr = fb.includes('역사적 오류') || fb.includes('역사 오류') || fb.includes('역사적 왜곡');
        const cls = isAI ? 'ai' : isErr ? 'error' : 'general';
        const lbl = isAI ? '🤖 AI 의심' : isErr ? '⚠️ 역사 오류' : '💬 피드백';
        return `<span class="feedback-indicator ${cls}">${lbl}</span>`;
      })() : ''}
      <button class="card-del-btn" onclick="event.stopPropagation(); deletePanel('${itemId}', '${item.relicName}')">🗑️ 삭제</button>`;
    return card;
  }

  function renderGallery() {
    const norm = s => String(s).replace(/\s/g,'');
    const lbl = document.getElementById('filter-label');
    lbl.textContent = currentFilter ? `→ ${currentFilter}반 작품만 표시 중` : '';

    if (currentSort === 'number') {
      document.getElementById('view-votes').style.display = 'none';
      document.getElementById('view-number').style.display = 'block';

      const sorted = [...items].sort((a, b) => {
        const ca = String(a.gradeClass).trim(), cb = String(b.gradeClass).trim();
        if (ca !== cb) return ca.localeCompare(cb, 'ko');
        return parseInt(a.stdNum) - parseInt(b.stdNum);
      });
      const visible = currentFilter
        ? sorted.filter(item => norm(item.gradeClass) === norm(currentFilter))
        : sorted;

      const byClass = {};
      visible.forEach(item => {
        const cls = String(item.gradeClass).trim();
        if (!byClass[cls]) byClass[cls] = [];
        byClass[cls].push(item);
      });

      const container = document.getElementById('number-container');
      container.innerHTML = '';
      const adminOn = isAdminMode;

      Object.keys(byClass).sort((a,b) => a.localeCompare(b,'ko')).forEach(cls => {
        const hall = document.createElement('div');
        hall.className = 'expo-hall' + (adminOn ? ' admin-mode-on' : '');
        hall.style.marginBottom = '1.5rem';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'hall-title';
        titleDiv.innerHTML = `<span>📚 ${cls}반</span><span class="hall-badge">${byClass[cls].length}점 전시 중</span>`;

        const grid = document.createElement('div');
        grid.className = 'grid';
        byClass[cls].forEach(item => grid.appendChild(makeCard(item)));

        hall.appendChild(titleDiv);
        hall.appendChild(grid);
        container.appendChild(hall);
      });

    } else {
      document.getElementById('view-votes').style.display = '';
      document.getElementById('view-number').style.display = 'none';

      const sorted = [...items].sort((a, b) => b.votes - a.votes);
      const visible = currentFilter
        ? sorted.filter(item => norm(item.gradeClass) === norm(currentFilter))
        : sorted;

      const goryeoGrid = document.getElementById('goryeo-grid');
      const joseonGrid = document.getElementById('joseon-grid');
      goryeoGrid.innerHTML = '';
      joseonGrid.innerHTML = '';
      let gCount = 0, jCount = 0;

      visible.forEach(item => {
        if (item.hall.includes("고려")) { goryeoGrid.appendChild(makeCard(item)); gCount++; }
        else { joseonGrid.appendChild(makeCard(item)); jCount++; }
      });

      document.getElementById('goryeo-count').innerText = `${gCount}점 전시 중`;
      document.getElementById('joseon-count').innerText = `${jCount}점 전시 중`;
    }
  }

  const VOTED_KEY = 'curator_voted_panels';

  function getVotedSet() {
    try { return new Set(JSON.parse(localStorage.getItem(VOTED_KEY) || '[]')); }
    catch(e) { return new Set(); }
  }

  function saveVoted(id) {
    try {
      const s = getVotedSet(); s.add(String(id));
      localStorage.setItem(VOTED_KEY, JSON.stringify([...s]));
    } catch(e) {}
  }

  function hasVoted(id) { return getVotedSet().has(String(id)); }

  function voteForItem(id) {
    if (hasVoted(id)) return;
    saveVoted(id);
    const btn = document.getElementById('vote-btn-' + id);
    if (btn) { btn.disabled = true; btn.innerText = '⏳ 투표 중...'; }
    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'vote', id: id })
    })
    .then(res => res.json())
    .then(data => {
      if (btn) { btn.innerText = `✅ 추천 완료 (${data.count || ''}표)`; btn.style.opacity='0.7'; }
      loadGallery();
    })
    .catch(() => {
      fetch(GAS_URL, { method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'vote', id: id }) });
      if (btn) { btn.innerText = '✅ 추천 완료!'; btn.style.opacity='0.7'; }
      setTimeout(loadGallery, 2000);
    });
  }

  let currentModalItem = null;

  function panelHTML(item) {
    return `<div class="print-panel">
      <div class="print-hall">${item.hall}</div>
      <div class="print-title">${item.relicName}</div>
      <div class="print-curator">전시 기획: ${item.gradeClass} ${item.stdNum}번 ${item.stdName} 큐레이터 · 관람객 추천 ${item.votes}표</div>
      ${(item.imageUrl1 || item.imageUrl2) ? `<div class="print-imgs">
        ${item.imageUrl1 ? `<div><img src="${item.imageUrl1}" alt="사료1"><div class="print-img-cap">▲ ${item.imgCaption1||'사료 사진 1'}</div></div>` : ''}
        ${item.imageUrl2 ? `<div><img src="${item.imageUrl2}" alt="사료2"><div class="print-img-cap">▲ ${item.imgCaption2||'사료 사진 2'}</div></div>` : ''}
      </div>` : ''}
      <div class="print-spec"><strong>[문화유산 기본 정보]</strong><br>${item.relicSpec}</div>
      <div class="print-section-title">큐레이터의 시선 (시대적 배경)</div>
      <div class="print-text">${item.historyContext}</div>
      <div class="print-section-title">큐레이터의 해석 (역사적 의의)</div>
      <div class="print-text">${item.curatorVoice}</div>
      ${item.totalScore ? `<div class="print-score">✏️ 채점: 총 ${item.totalScore}점/20점 &nbsp;(①${item.score1||'?'}점 ②${item.score2||'?'}점 ③${item.score3||'?'}점 ④${item.score4||'?'}점)</div>` : ''}
      <div class="print-source">사료 출처: ${item.source}</div>
    </div>`;
  }

  function printItem(item) {
    if (!item) return;
    document.getElementById('print-area').innerHTML = panelHTML(item);
    window.print();
  }

  function printClass() {
    const norm = s => String(s).replace(/\s/g,'');
    const targets = currentFilter
      ? items.filter(i => norm(i.gradeClass) === norm(currentFilter))
      : items;
    if (!targets.length) { alert('출력할 작품이 없습니다.'); return; }
    const label = currentFilter ? `${currentFilter}반 전체 작품` : '전체 작품';
    const sorted = currentSort === 'number'
      ? [...targets].sort((a, b) => {
          const ca = String(a.gradeClass).trim(), cb = String(b.gradeClass).trim();
          if (ca !== cb) return ca.localeCompare(cb, 'ko');
          return parseInt(a.stdNum) - parseInt(b.stdNum);
        })
      : targets;
    document.getElementById('print-area').innerHTML =
      `<div class="print-class-title">역사 큐레이터 기획전 — ${label}</div>` +
      sorted.map(i => panelHTML(i)).join('');
    window.print();
  }

  function openModal(item) {
    currentModalItem = item;
    const inner = document.getElementById('modal-inner');
    inner.innerHTML = `
      <div style="font-size:0.8rem; color:#A07828; font-weight:bold;">${item.hall}</div>
      <h2 style="margin: 0.4rem 0 0.2rem;">${item.relicName}</h2>
      <div style="font-size:0.85rem; color:#666; margin-bottom:0.8rem;">전시 기획: ${item.gradeClass} ${item.stdNum}번 ${item.stdName} 큐레이터 (관람객 추천 ${item.votes}표)</div>
      ${hasVoted(item.id)
        ? `<button id="vote-btn-${item.id}" disabled
             style="width:100%; padding:0.9rem; background:#444; color:#aaa; border:2px solid #666;
                    border-radius:8px; font-size:1rem; font-weight:bold; cursor:not-allowed; margin-bottom:1.2rem;
                    opacity:0.7;">
             ✅ 이미 추천했습니다 (${item.votes}표)
           </button>`
        : `<button id="vote-btn-${item.id}" onclick="voteForItem('${item.id}')"
             style="width:100%; padding:0.9rem; background:#1C2830; color:#F8D675; border:2px solid #A07828;
                    border-radius:8px; font-size:1rem; font-weight:bold; cursor:pointer; margin-bottom:1.2rem;
                    letter-spacing:0.05em;">
             ⭐ 이 패널 추천하기 (현재 ${item.votes}표)
           </button>`
      }
      <div class="modal-gallery">
        ${item.imageUrl1 ? `<div>
          <img src="${item.imageUrl1}" alt="사료 사진 1" style="width:100%;border-radius:4px;" onerror="this.parentElement.style.display='none'">
          <div style="font-size:0.7rem;color:#888;text-align:center;margin-top:0.2rem;">▲ ${item.imgCaption1 || '사료 사진 1'}</div>
        </div>` : ''}
        ${item.imageUrl2 ? `<div>
          <img src="${item.imageUrl2}" alt="사료 사진 2" style="width:100%;border-radius:4px;" onerror="this.parentElement.style.display='none'">
          <div style="font-size:0.7rem;color:#888;text-align:center;margin-top:0.2rem;">▲ ${item.imgCaption2 || '사료 사진 2'}</div>
        </div>` : ''}
      </div>
      <div style="background:#F0E4C0; padding:0.6rem; font-size:0.85rem; margin-bottom:1rem; border-radius:4px;"><strong>[문화유산 기본 정보]</strong><br>${item.relicSpec}</div>
      <div style="margin-bottom:1rem;">
        <strong style="color:#A07828;">큐레이터의 시선 (시대적 배경):</strong>
        <p style="margin-top:0.3rem; font-size:0.9rem; line-height:1.6; color:#3A4855; max-height:7em; overflow-y:auto; padding-right:0.3rem;">${item.historyContext}</p>
      </div>
      <div style="margin-bottom:1rem;">
        <strong style="color:#A07828;">큐레이터의 해석 (역사적 의의):</strong>
        <p style="margin-top:0.3rem; font-size:0.92rem; line-height:1.6; background:#fff; padding:0.8rem; border-left:4px solid #1C2830; border-radius:2px;">${item.curatorVoice}</p>

      <div style="margin-top:1rem; text-align:right;">
        <button onclick="printItem(currentModalItem)" style="background:#1C2830; color:#C89A40; border:1px solid #A07828; border-radius:4px; padding:0.5rem 1rem; font-size:0.85rem; font-weight:bold; cursor:pointer;">🖨️ 이 작품 출력</button>
      </div>`;
    if (isAdminMode) {
      inner.innerHTML += scoreHTML(item);
      updateScoreTotal();

    document.getElementById('modal').style.display = 'flex';

  function closeModal(e) {
    if (e.target.id === 'modal') document.getElementById('modal').style.display = 'none';
  }

  let adminPassword = '';
  let adminPasswordHash = '';
  let isAdminMode = false;

  function saveApiKey() {
    try { localStorage.setItem('gallery_api_key', document.getElementById('anthropic-api-key').value); } catch(e) {}
  }

  async function enterAdminMode() {
    if (!adminPasswordHash) {
      const val = prompt('관리자 비밀번호를 입력하세요:');
      if (!val) return;
      const hash = await sha256hex(val);
      if (hash !== GALLERY_PW_HASH) { alert('비밀번호가 틀렸습니다.'); return; }
      adminPassword = val;
      adminPasswordHash = hash;
    }
    isAdminMode = true;
    document.getElementById('admin-bar').classList.add('active');
    document.getElementById('view-votes').classList.add('admin-mode-on');
    renderGallery();
    try {
      var saved = localStorage.getItem('gallery_api_key');
      if (saved) document.getElementById('anthropic-api-key').value = saved;
    } catch(e) {}
  }

  async function testApiKey() {
    const apiKey = document.getElementById('anthropic-api-key').value.trim();
    if (!apiKey) { alert('API 키를 입력하세요.'); return; }
    const btn = document.getElementById('btn-test-key');
    btn.disabled = true; btn.innerText = '⏳ 테스트 중...'; btn.style.background = '#666';
    try {
      const r = await fetch(GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'testKey', password: adminPasswordHash, apiKey })
      });
      const d = await r.json();
      if (d.result === 'ok') {
        btn.innerText = '✅ 연결 성공'; btn.style.background = '#28a745';
        saveApiKey();
      } else {
        btn.innerText = '❌ ' + (d.message || d.result); btn.style.background = '#dc3545';
      }
    } catch(e) { btn.innerText = '❌ 네트워크 오류'; btn.style.background = '#dc3545'; }
    setTimeout(() => { btn.disabled = false; btn.innerText = '🔑 키 테스트'; btn.style.background = '#1B6CA8'; }, 4000);
  }

  function exitAdminMode() {
    isAdminMode = false;
    adminPassword = '';
    adminPasswordHash = '';
    document.getElementById('admin-bar').classList.remove('active');
    document.getElementById('view-votes').classList.remove('admin-mode-on');
    renderGallery();
  }

  function deletePanel(id, name) {
    if (!confirm(`"${name}" 패널을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', id: id, password: adminPasswordHash })
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'deleted') {
        alert(`"${name}" 패널이 삭제되었습니다.`);
        loadGallery();
      } else if (data.result === 'unauthorized') {
        alert('비밀번호가 틀렸습니다. 관리자 모드를 종료하고 다시 시도하세요.');
        exitAdminMode();
      } else {
        alert('삭제 중 오류가 발생했습니다: ' + JSON.stringify(data));
      }
    })
    .catch(() => alert('서버 연결 오류. Apps Script 배포 설정을 확인하세요.'));
  }

      <textarea id="feedback-text" placeholder="피드백을 입력하세요. 예) AI 생성 의심 — 문장 구조가 AI 특유의 패턴임. / 역사적 오류 — 고려청자 제작 시기 혼동." style="width:100%;height:90px;padding:0.55rem 0.7rem;border:1px solid #ccc;border-radius:6px;font-size:0.82rem;line-height:1.6;resize:vertical;font-family:inherit;box-sizing:border-box;">${item.feedback||''}</textarea>
      <button onclick="saveFeedback('${item.id}')"
        style="width:100%;margin-top:0.5rem;padding:0.65rem;background:#4a2020;color:#ffcccc;
               border:1px solid #8B0000;border-radius:4px;font-size:0.9rem;font-weight:bold;cursor:pointer;">
        💬 피드백 저장
      </button>

  function updateScoreTotal() {
    const vals = ['score1','score2','score3','score4'].map(id => parseInt(document.getElementById(id)?.value)||0);
    const el = document.getElementById('sc-total');
    if (el) el.innerText = vals.every(v=>v>0) ? vals.reduce((a,b)=>a+b,0) : '-';
  }

  function saveScore(id) {
    const s1=parseInt(document.getElementById('score1').value)||0;
    const s2=parseInt(document.getElementById('score2').value)||0;
    const s3=parseInt(document.getElementById('score3').value)||0;
    const s4=parseInt(document.getElementById('score4').value)||0;
    if (!s1||!s2||!s3||!s4) { alert('4개 항목 모두 점수를 선택해 주세요.'); return; }
    fetch(GAS_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'score', id, password:adminPasswordHash, score1:s1, score2:s2, score3:s3, score4:s4})
    })
    .then(r=>r.json())
    .then(d => {
      if (d.result==='scored') { alert(`채점 완료! 합계 ${d.total}점`); loadGallery(); }
      else { alert('저장 실패: '+JSON.stringify(d)); }
    })
    .catch(()=>alert('서버 오류. 네트워크를 확인하세요.'));
  }

  function autoScorePanel(id) {
    const btn = document.getElementById('ai-score-btn');
    const resultDiv = document.getElementById('ai-score-result');
    if (btn) { btn.disabled = true; btn.innerText = '⏳ AI 채점 중...'; }
    if (resultDiv) resultDiv.style.display = 'none';
    fetch(GAS_URL, {
      method: 'POST', headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({action:'autoScore', id, password:adminPasswordHash, apiKey: document.getElementById('anthropic-api-key').value.trim(), customCriteria: getScoringCriteria()})
    })
    .then(r => r.json())
    .then(d => {
      if (btn) { btn.disabled = false; btn.innerText = '🤖 AI 자동채점'; }
      if (d.result === 'no_api_key') {
        alert('⚠️ Anthropic API 키가 설정되지 않았습니다.\nApps Script 에디터 → 프로젝트 설정 → 스크립트 속성에\nANTHROPIC_API_KEY를 추가하세요.');
        return;
      }
      if (d.result !== 'auto_scored') { alert('AI 채점 실패: ' + (d.message || JSON.stringify(d))); return; }
      ['score1','score2','score3','score4'].forEach((sid,i) => {
        const el = document.getElementById(sid);
        if (el) { el.value = d['score'+(i+1)]; }
      });
      updateScoreTotal();
      if (resultDiv) {
        const labels = ['① 문화유산 선정','② 시대적 배경','③ 역사적 의의','④ 형식 완성도'];
        resultDiv.innerHTML = '<strong style="color:#0f4c75;">🤖 AI 채점 근거</strong><br>' +
          labels.map((lb,i) => `<span style="color:#555;">${lb} ${d['score'+(i+1)]}점:</span> ${d['reason'+(i+1)]}`).join('<br>') +
          '<br><span style="font-size:0.78rem;color:#888;">※ 점수를 확인 후 [💾 채점 저장]을 눌러주세요.</span>';
        resultDiv.style.display = 'block';
      }
    })
    .catch(err => {
      if (btn) { btn.disabled = false; btn.innerText = '🤖 AI 자동채점'; }
      alert('서버 오류: ' + err);
    });
  }

  async function bulkAutoScore() {
    const norm = s => String(s).replace(/\s/g,'');
    const targets = currentFilter
      ? items.filter(i => norm(i.gradeClass) === norm(currentFilter))
      : items;
    if (!targets.length) { alert('채점할 작품이 없습니다.'); return; }
    const unscored = targets.filter(i => !(i.totalScore > 0));
    const msg = currentFilter
      ? `[${currentFilter}반] 전체 ${targets.length}개 중 미채점 ${unscored.length}개를 AI로 자동채점하고 저장합니다.\n계속하시겠습니까?`
      : `전체 ${targets.length}개 중 미채점 ${unscored.length}개를 AI로 자동채점하고 저장합니다.\n계속하시겠습니까?`;
    if (!unscored.length) { alert('미채점 패널이 없습니다.'); return; }
    if (!confirm(msg)) return;

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:9999;';
    overlay.innerHTML = `<div style="background:#fff;padding:1.8rem;border-radius:10px;max-width:420px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.4);">
      <div style="font-size:1.05rem;font-weight:bold;margin-bottom:1rem;color:#0f4c75;">🤖 AI 일괄채점 진행 중...</div>
      <div style="background:#eee;border-radius:4px;height:10px;margin-bottom:0.7rem;overflow:hidden;">
        <div id="bulk-bar" style="background:#0f4c75;height:10px;width:0%;transition:width 0.4s;"></div>
      </div>
      <div id="bulk-stat" style="font-size:0.88rem;color:#555;margin-bottom:0.5rem;">0 / ${unscored.length}</div>
      <div id="bulk-log" style="font-size:0.77rem;color:#666;max-height:140px;overflow-y:auto;text-align:left;border:1px solid #eee;padding:0.4rem;border-radius:4px;"></div>
    </div>`;
    document.body.appendChild(overlay);

    const logEl = document.getElementById('bulk-log');
    let done = 0, success = 0, failed = 0;

    for (const item of unscored) {
      try {
        const r1 = await fetch(GAS_URL, {
          method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({action:'autoScore', id:item.id, password:adminPasswordHash, apiKey: document.getElementById('anthropic-api-key').value.trim(), customCriteria: getScoringCriteria()})
        });
        const d1 = await r1.json();
        if (d1.result !== 'auto_scored') {
          logEl.innerHTML += `<div style="color:#c00;">✗ ${item.gradeClass} ${item.stdName} — ${d1.result||'오류'}${d1.message ? ': '+d1.message : ''}</div>`;
          failed++; done++;
          document.getElementById('bulk-stat').innerText = `${done}/${unscored.length} (✓${success} ✗${failed})`;
          document.getElementById('bulk-bar').style.width = (done/unscored.length*100)+'%';
          continue;
        }
        const r2 = await fetch(GAS_URL, {
          method:'POST', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({action:'score', id:item.id, password:adminPasswordHash,
            score1:d1.score1, score2:d1.score2, score3:d1.score3, score4:d1.score4})
        });
        const d2 = await r2.json();
        const total = d1.score1+d1.score2+d1.score3+d1.score4;
        if (d2.result === 'scored') {
          logEl.innerHTML += `<div style="color:#0a5;">✓ ${item.gradeClass} ${item.stdName} — ${total}점</div>`;
          success++;
        } else {
          logEl.innerHTML += `<div style="color:#c00;">✗ ${item.gradeClass} ${item.stdName} 저장 실패</div>`;
          failed++;
        }
      } catch(e) {
        logEl.innerHTML += `<div style="color:#c00;">✗ ${item.stdName} — 연결 오류</div>`;
        failed++;
      }
      done++;
      logEl.scrollTop = logEl.scrollHeight;
      document.getElementById('bulk-stat').innerText = `${done}/${unscored.length} (✓${success} ✗${failed})`;
      document.getElementById('bulk-bar').style.width = (done/unscored.length*100)+'%';
      await new Promise(res => setTimeout(res, 100));
    }

    logEl.innerHTML += `<div style="margin-top:0.4rem;font-weight:bold;color:#0f4c75;">완료! 채점 ${success}건 / 오류 ${failed}건</div>`;
    setTimeout(() => { document.body.removeChild(overlay); loadGallery(); }, 3000);
  }

  var GALLERY_PW_HASH = '4c16016741f6c1ec8ab0afb40d66fb1a86f5a7906a02b8a18391f7c4dcdf0f46';
  var _unlocked = false;

  var DEFAULT_CRITERIA = '[채점 기준] 각 항목 1~5점 (총 20점)\n'
    + '① 문화유산 선정 (5점)\n'
    + '5=성취기준에 부합하는 문화유산을 선정하고 관련 사료 및 탐구 자료를 풍부하게 제시함\n'
    + '4=성취기준에 부합하는 문화유산을 선정하였으나 탐구 자료가 다소 부족함\n'
    + '3=성취기준과의 연계성이 다소 부족하거나 탐구 자료 제시가 단편적임\n'
    + '2=성취기준과 무관한 문화유산을 선정하였거나 탐구 자료 제시가 매우 빈약함\n'
    + '1=참여하였으나 문화유산 선정 및 자료 제시가 전혀 없음 또는 무의미한 입력\n\n'
    + '② 시대적 배경 분석 (5점)\n'
    + '5=문화유산의 시대적 배경을 구체적 사실에 근거하여 왜곡 없이 정확하게 설명함\n'
    + '4=시대적 배경을 설명하였으나 세부 역사 사실의 제시가 다소 부족함\n'
    + '3=시대적 배경을 단편적인 사실 나열 수준으로 단순하게 서술함\n'
    + '2=배경 설명에 역사적 오류가 다수 포함되거나 내용이 매우 빈약함\n'
    + '1=참여하였으나 시대적 배경 서술이 전혀 없음 또는 무의미한 입력\n\n'
    + '③ 역사적 의의 분석 (5점)\n'
    + '5=역사적 의의를 타당한 근거를 바탕으로 논리정연하게 설명함\n'
    + '4=역사적 의의를 설명하였으나 근거와 논리가 다소 부족함\n'
    + '3=역사적 의의를 단순하게 언급하거나 서술 내용이 단편적임\n'
    + '2=역사적 의의 서술에 오류가 많거나 근거가 전혀 없이 매우 빈약함\n'
    + '1=참여하였으나 역사적 의의 서술이 전혀 없음 또는 무의미한 입력\n\n'
    + '④ 형식 및 완성도 (5점)\n'
    + '5=필수 양식(문화유산 기본정보·출처·사진2장)을 빠짐없이 갖추어 완성도 있게 작성함\n'
    + '4=양식을 대체로 갖추었으나 일부 서술이 다소 미흡하거나 사진이 1장임\n'
    + '3=필수 양식이 일부 누락되었거나 전체적인 작성 분량이 부족함\n'
    + '2=양식을 거의 갖추지 못하였거나 글의 완성도가 매우 빈약함\n'
    + '1=참여하였으나 결과물 작성이 전혀 없음';

  function getScoringCriteria() {
    try { return localStorage.getItem('scoring_criteria') || DEFAULT_CRITERIA; } catch(e) { return DEFAULT_CRITERIA; }
  }
  function openCriteriaEditor() {
    document.getElementById('criteria-text').value = getScoringCriteria();
    document.getElementById('criteria-modal').style.display = 'flex';
  }
  function closeCriteriaEditor() {
    document.getElementById('criteria-modal').style.display = 'none';
  }
  function saveCriteria() {
    try { localStorage.setItem('scoring_criteria', document.getElementById('criteria-text').value); } catch(e) {}
    closeCriteriaEditor();
    alert('✅ 채점 기준이 저장됐습니다. 다음 채점부터 적용됩니다.');
  }
  function resetCriteria() {
    document.getElementById('criteria-text').value = DEFAULT_CRITERIA;
  }

  function addFeedbackTag(tag) {
    const ta = document.getElementById('feedback-text');
    if (!ta) return;
    const sep = ta.value && !ta.value.endsWith(' ') ? ' ' : '';
    ta.value += sep + tag + ' ';
    ta.focus();
  }

  function saveFeedback(id) {
    const fb = document.getElementById('feedback-text').value.trim();
    fetch(GAS_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'feedback', id, password:adminPasswordHash, feedback:fb})
    })
    .then(r => r.json())
    .then(d => {
      if (d.result === 'ok' || d.result === 'feedback_saved') {
        alert(fb ? '💬 피드백이 저장됐습니다.' : '피드백이 삭제됐습니다.');
        loadGallery();
      } else {
        alert('저장 실패: ' + JSON.stringify(d));
      }
    })
    .catch(() => alert('서버 오류. 네트워크를 확인하세요.'));
  }

  async function sha256hex(str) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  async function checkPw() {
    var val = document.getElementById('pwInput').value;
    var hash = await sha256hex(val);
    if (hash === GALLERY_PW_HASH) {
      _unlocked = true;
      adminPassword = val;
      adminPasswordHash = hash;
      document.getElementById('pwOverlay').style.display = 'none';
      document.getElementById('pwInput').value = '';
      try { sessionStorage.setItem('gallery_unlocked', '1'); } catch(e) {}
      loadGallery();
      setInterval(loadGallery, 10000);
    } else {
      var err = document.getElementById('pwErr');
      err.style.display = 'block';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
      setTimeout(function() { err.style.display = 'none'; }, 2000);
    }
  }

  (function() {
    try {
      if (sessionStorage.getItem('gallery_unlocked') === '1') {
        _unlocked = true;
        document.getElementById('pwOverlay').style.display = 'none';
      }
    } catch(e) {}
  })();

  updateClockDisplay();
  if (_unlocked) {
    loadGallery();
    setInterval(loadGallery, 10000);
  }
</script>
