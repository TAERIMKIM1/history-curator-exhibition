<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>고려·조선 문화유산 특별전 실시간 갤러리</title>
  <style>
    :root {
      --header-bg: #1C2830;
      --accent: #A07828;
      --accent-light: #C89A40;
      --bg: #EAE3D2;
      --card-bg: #F6F1E7;
      --timer-bg: #141D23;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Malgun Gothic', sans-serif; color: #1C2830; padding: 1.5rem; }

    .timer-banner {
      background: var(--timer-bg);
      color: #fff;
      padding: 1rem 1.8rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      border-left: 6px solid var(--accent-light);
    }
    .timer-info h1 { font-size: 1.4rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .timer-info p { font-size: 0.85rem; color: var(--accent-light); margin-top: 0.2rem; }
    .timer-box { display: flex; align-items: center; gap: 1.2rem; }
    .countdown-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.2rem;
      font-weight: bold;
      color: #F8D675;
      letter-spacing: 2px;
      background: #0B1013;
      padding: 0.2rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }
    .timer-controls button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 0.8rem;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .timer-controls button:hover { background: var(--accent-light); }

    .expo-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .expo-hall { background: rgba(255,255,255,0.65); padding: 1.2rem; border-radius: 8px; border: 1px solid #D8CABA; }
    .hall-title { font-size: 1.25rem; font-weight: bold; padding-bottom: 0.6rem; border-bottom: 2px solid var(--header-bg); margin-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
    .hall-badge { font-size: 0.8rem; background: var(--header-bg); color: var(--accent-light); padding: 0.2rem 0.6rem; border-radius: 12px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
    .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; position: relative; border: 1px solid #D8CABA; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 135px; object-fit: cover; background: #eee; }
    .card-body { padding: 0.75rem; }
    .card-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-curator { font-size: 0.75rem; color: #555; }
    .vote-tag { position: absolute; top: 8px; right: 8px; background: rgba(28,40,48,0.88); color: var(--accent-light); padding: 0.2rem 0.55rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; border: 1px solid var(--accent); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 1rem; z-index: 1000; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 720px; max-height: 90vh; border-radius: 6px; overflow-y: auto; padding: 1.8rem; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1.2rem; font-size: 1.5rem; font-weight: bold; cursor: pointer; border: none; background: none; }
    .modal-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1rem; }
    .modal-gallery img { width: 100%; height: 200px; object-fit: contain; background: #faf8f5; border-radius: 4px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <div class="timer-banner">
    <div class="timer-info">
      <h1>🏛️ 고려·조선 특별 기획전</h1>
      <p id="timer-status">1일 학예연구사 패널 기획 마감까지 남은 시간</p>
    </div>
    <div class="timer-box">
      <div class="countdown-display" id="clock">24:00</div>
      <div class="timer-controls">
        <button id="btn-timer" onclick="toggleTimer()">▶ 시작</button>
        <button onclick="resetTimer()">↺ 초기화</button>
        <button onclick="loadGallery()">🔄 갤러리 갱신</button>
      </div>
    </div>
  </div>

  <div class="expo-container">
    <div class="expo-hall">
      <div class="hall-title">
        <span>고려 특별전시관</span>
        <span class="hall-badge" id="goryeo-count">0점 전시 준비 중</span>
      </div>
      <div class="grid" id="goryeo-grid"></div>
    </div>
    <div class="expo-hall">
      <div class="hall-title">
        <span>조선 특별전시관</span>
        <span class="hall-badge" id="joseon-count">0점 전시 준비 중</span>
      </div>
      <div class="grid" id="joseon-grid"></div>
    </div>
  </div>

  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" id="modal-body">
      <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">&times;</button>
      <div id="modal-inner"></div>
    </div>
  </div>

<script>
  // ★ 여기에 Apps Script 웹앱 URL을 입력하세요
  const GAS_URL = "https://script.google.com/macros/s/AKfycbweLp9sgFPlQ5rbDBMmKHvuJxp8LjIFOwsKhDySYDZRvBcEEeZtx-LUVStO_WBaVBmOHA/exec";

  const DEFAULT_SECONDS = 24 * 60;
  let remainingSeconds = DEFAULT_SECONDS;
  let timerInterval = null;
  let isRunning = false;

  function updateClockDisplay() {
    const min = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
    const sec = String(remainingSeconds % 60).padStart(2, '0');
    document.getElementById('clock').innerText = `${min}:${sec}`;
  }

  function toggleTimer() {
    const btn = document.getElementById('btn-timer');
    if (isRunning) {
      clearInterval(timerInterval);
      isRunning = false;
      btn.innerText = '▶ 재개';
    } else {
      isRunning = true;
      btn.innerText = '⏸ 일시정지';
      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateClockDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          btn.innerText = '종료됨';
          document.getElementById('timer-status').innerText = '🎉 특별전 정식 개막! 관람객 추천 투표를 시작하세요.';
          document.getElementById('clock').style.color = '#FF6B6B';
          alert('⏰ 전시 준비 시간(24분)이 종료되었습니다!\n모든 패널을 발행하고 갤러리 투어 및 투표를 시작하세요.');
        }
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    remainingSeconds = DEFAULT_SECONDS;
    updateClockDisplay();
    document.getElementById('btn-timer').innerText = '▶ 시작';
    document.getElementById('clock').style.color = '#F8D675';
    document.getElementById('timer-status').innerText = '1일 학예연구사 패널 기획 마감까지 남은 시간';
  }

  let items = [];

  function loadGallery() {
    if (!GAS_URL || GAS_URL === "GAS_URL_PLACEHOLDER") return;
    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => { items = data; renderGallery(); })
      .catch(err => console.error(err));
  }

  function renderGallery() {
    const goryeoGrid = document.getElementById('goryeo-grid');
    const joseonGrid = document.getElementById('joseon-grid');
    goryeoGrid.innerHTML = '';
    joseonGrid.innerHTML = '';
    let gCount = 0, jCount = 0;
    items.sort((a, b) => b.votes - a.votes);

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openModal(item);
      card.innerHTML = `
        <span class="vote-tag">🏷️ ${item.votes}표</span>
        <img src="${item.imageUrl1 || ''}" alt="대표 사료">
        <div class="card-body">
          <div class="card-title">${item.relicName}</div>
          <div class="card-curator">${item.gradeClass} ${item.stdNum}번 ${item.stdName} 큐레이터</div>
        </div>`;
      if (item.hall.includes("고려")) { goryeoGrid.appendChild(card); gCount++; }
      else { joseonGrid.appendChild(card); jCount++; }
    });

    document.getElementById('goryeo-count').innerText = `${gCount}점 전시 중`;
    document.getElementById('joseon-count').innerText = `${jCount}점 전시 중`;
  }

  function openModal(item) {
    const inner = document.getElementById('modal-inner');
    inner.innerHTML = `
      <div style="font-size:0.8rem; color:#A07828; font-weight:bold;">${item.hall}</div>
      <h2 style="margin: 0.4rem 0 0.2rem;">${item.relicName}</h2>
      <div style="font-size:0.85rem; color:#666; margin-bottom:1rem;">전시 기획: ${item.gradeClass} ${item.stdNum}번 ${item.stdName} 큐레이터 (관람객 추천 ${item.votes}표)</div>
      <div class="modal-gallery">
        <img src="${item.imageUrl1}" alt="사료 사진 1">
        <img src="${item.imageUrl2}" alt="사료 사진 2">
      </div>
      <div style="background:#F0E4C0; padding:0.6rem; font-size:0.85rem; margin-bottom:1rem; border-radius:4px;"><strong>[유물 기본 제원]</strong><br>${item.relicSpec}</div>
      <div style="margin-bottom:1rem;">
        <strong style="color:#A07828;">학예사의 시선 (시대적 배경):</strong>
        <p style="margin-top:0.3rem; font-size:0.9rem; line-height:1.6; color:#3A4855;">${item.historyContext}</p>
      </div>
      <div style="margin-bottom:1rem;">
        <strong style="color:#A07828;">큐레이터 한 줄 (역사적 의의):</strong>
        <p style="margin-top:0.3rem; font-size:0.92rem; line-height:1.6; background:#fff; padding:0.8rem; border-left:4px solid #1C2830; border-radius:2px;">${item.curatorVoice}</p>
      </div>
      <div style="font-size:0.75rem; color:#888; border-top:1px solid #D8CABA; padding-top:0.6rem;">사료 출처: ${item.source}</div>`;
    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal(e) {
    if (e.target.id === 'modal') document.getElementById('modal').style.display = 'none';
  }

  updateClockDisplay();
  loadGallery();
  setInterval(loadGallery, 10000);
</script>
</body>
</html>
